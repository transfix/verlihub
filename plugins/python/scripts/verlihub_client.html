<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verlihub Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; display: flex; flex-direction: column; align-items: center; }
        .page-wrapper { max-width: 1024px; width: 100%; }
        #tabs { margin-bottom: 20px; position: relative; z-index: 100; }
        .tab { cursor: pointer; display: inline-block; padding: 10px 15px; background: #eee; border: 1px solid #ccc; margin-right: 5px; border-radius: 5px 5px 0 0; position: relative; z-index: 101; }
        .tab.active { background: #fff; border-bottom: none; font-weight: bold; }
        #content { padding: 20px; border: 1px solid #ccc; border-radius: 0 5px 5px 5px; background: #fff; min-height: 300px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; font-size: 1em; cursor: pointer; user-select: none; }
        th:hover { background: #e9e9e9; }
        tr:nth-child(even) { background: #fafafa; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        #user-detail { position: fixed; top: 15%; left: 15%; width: 70%; max-height: 70%; overflow-y: auto; background: #fff; border: 1px solid #aaa; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.3); display: none; z-index: 1000; border-radius: 8px; }
        #user-detail button { float: right; padding: 8px 12px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .flag { font-size: 2em; text-align: center; }
        .count { text-align: center; font-weight: bold; font-size: 1.2em; }
        .total-countries { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .section { margin-bottom: 30px; }
        .section h2 { margin: 0 0 15px 0; font-size: 1.4em; }
        .sort-arrow { margin-left: 6px; opacity: 0.5; }
        .sort-arrow.active { opacity: 1; font-weight: bold; }

        /* Chat tab styles */
        .chat-container { display: flex; flex-direction: column; height: 500px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 14px; line-height: 1.5; }
        .chat-msg.user { text-align: right; }
        .chat-msg.user .chat-bubble { background: #0066cc; color: #fff; display: inline-block; padding: 8px 14px; border-radius: 14px 14px 4px 14px; max-width: 75%; text-align: left; }
        .chat-msg.assistant .chat-bubble { background: #e9e9e9; display: inline-block; padding: 8px 14px; border-radius: 14px 14px 14px 4px; max-width: 75%; text-align: left; }
        .chat-msg.status { text-align: center; font-size: 0.85em; color: #999; }
        .chat-msg.status .chat-bubble { background: none; display: inline; padding: 0; }
        .chat-tool-badge { display: inline-block; background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin: 2px 0; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 1em; outline: none; }
        .chat-input-row input:focus { border-color: #0066cc; }
        .chat-input-row button { padding: 10px 20px; border: none; background: #0066cc; color: #fff; border-radius: 20px; cursor: pointer; font-size: 1em; }
        .chat-input-row button:disabled { background: #999; cursor: not-allowed; }
        .chat-input-row button:hover:not(:disabled) { background: #0052a3; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .chat-header .chat-status { font-size: 0.85em; color: #999; }
        .chat-header .chat-status.connected { color: #28a745; }
        .chat-header .chat-status.error { color: #dc3545; }
        .chat-admin-toggle { font-size: 0.85em; }
        .chat-admin-toggle label { cursor: pointer; }

        .page-header { text-align: center; margin-bottom: 20px; }
        .hub-name { font-size: 2em; margin: 0; }
        .hub-desc { font-size: 1.1em; color: #555; margin: 10px 0 0 0; }
        
        @media (max-width: 768px) {
            .page-wrapper { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-header">
            <h1 id="hub-name-header" class="hub-name">Verlihub Dashboard</h1>
            <p id="hub-desc-header" class="hub-desc"></p>
        </div>

        <div id="tabs">
            <span class="tab active" data-tab="hub">Hub</span>
            <span class="tab" data-tab="users">Online Users</span>
            <span class="tab" data-tab="geo">Countries</span>
            <span class="tab" data-tab="cities">Cities</span>
            <span class="tab" data-tab="asns">ASNs</span>
            <span class="tab" data-tab="ips">IPs</span>
            <span class="tab" data-tab="chat">💬 Chat</span>
        </div>
        <div id="content">Loading...</div>
    </div>

    <div id="user-detail">
        <button onclick="closeUserDetail()">Close ×</button>
        <h2>User Details</h2>
        <div id="user-content"></div>
    </div>

    <script>
        const API_BASE = '/verlihub-api';

        let currentTab = 'hub';
        let pollInterval;

        // Chat state
        const CHAT_GATEWAY_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.hostname + ':8001';
        let chatSocket = null;
        let chatMessages = [];
        let chatConnected = false;
        let chatAdminMode = false;
        let chatWaiting = false;

        const sortState = {
            users: { key: 'share', asc: false }, // default: share descending
            geo: { key: 'users', asc: false }   // default: users descending
        };

        function fetchData(endpoint) {
            return fetch(API_BASE + endpoint)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                    return res.json();
                });
        }

        function formatBytes(bytes) {
            if (bytes === undefined || bytes === null) return 'N/A';
            const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(2)} ${units[i]}`;
        }

        function getFlagEmoji(cc) {
            if (!cc || cc.length !== 2) return '🌐';
            return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
        }

        function renderKeyValue(obj) {
            if (!obj || typeof obj !== 'object') return '<p>No data available</p>';
            let html = '<ul>';
            for (const [key, value] of Object.entries(obj)) {
                if (excludeKeys.includes(key)) continue;
                let displayKey = renameMap[key] || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                let formattedValue = value ?? 'N/A';
                if (typeof value === 'number' && (key.toLowerCase().includes('share') || key.toLowerCase().includes('size'))) {
                    formattedValue = formatBytes(value);
                } else if (typeof value === 'string') {
                    // Escape HTML to prevent < > from being interpreted as tags
                    formattedValue = value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                }
                html += `<li><strong>${displayKey}:</strong> ${formattedValue}</li>`;
            }
            html += '</ul>';
            return html;
        }

        function renderUsersTable(rows, sortKey, asc) {
            if (!Array.isArray(rows) || rows.length === 0) return '<p>No users currently online</p>';

            // Sort rows
            const sortedRows = [...rows].sort((a, b) => {
                let aVal, bVal;

                switch (sortKey) {
                    case 'nick':
                        aVal = (a.nick || a.Nick || '').toLowerCase();
                        bVal = (b.nick || b.Nick || '').toLowerCase();
                        return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    case 'class':
                        aVal = a.class_name || a.class || a.Class || '';
                        bVal = b.class_name || b.class || b.Class || '';
                        return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    case 'country':
                        aVal = (a.country_code || a.country || a.cc || a.CC || '').toUpperCase();
                        bVal = (b.country_code || b.country || b.cc || b.CC || '').toUpperCase();
                        return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    case 'share':
                    default:
                        aVal = Number(a.share_size || a.share || a.Share || 0);
                        bVal = Number(b.share_size || b.share || b.Share || 0);
                        return asc ? aVal - bVal : bVal - aVal;
                }
            });

            let html = '<table><thead><tr>';
            const headers = [
                { text: 'Nick', key: 'nick' },
                { text: 'Class', key: 'class' },
                { text: 'Country', key: 'country' },
                { text: 'Share', key: 'share' }
            ];

            headers.forEach(h => {
                const arrow = sortState.users.key === h.key 
                    ? (sortState.users.asc ? '↑' : '↓') 
                    : '↕';
                html += `<th onclick="setSort('users', '${h.key}')">${h.text} <span class="sort-arrow ${sortState.users.key === h.key ? 'active' : ''}">${arrow}</span></th>`;
            });
            html += '</tr></thead><tbody>';

            sortedRows.forEach(row => {
                const nick = row.nick || row.Nick || 'Unknown';
                const className = row.class_name || row.class || row.Class || 'N/A';
                const countryCode = row.country_code || row.country || row.Country || row.cc || row.CC || '';
                const shareBytes = row.share_size || row.share || row.Share || 0;

                html += '<tr>';
                html += `<td><a href="#" onclick="showUser('${encodeURIComponent(nick)}'); return false;">${nick}</a></td>`;
                html += `<td>${className}</td>`;
                html += `<td><span class="flag">${getFlagEmoji(countryCode)}</span></td>`;
                html += `<td>${formatBytes(shareBytes)}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        function renderGeo(data) {
            if (!data || !Array.isArray(data.distribution)) return '<p>No geographic data available</p>';

            const totalCountries = data.total_countries || data.distribution.length;

            // Sort distribution
            const sortedDist = [...data.distribution].sort((a, b) => {
                if (sortState.geo.key === 'country') {
                    return sortState.geo.asc 
                        ? a.country_code.localeCompare(b.country_code)
                        : b.country_code.localeCompare(a.country_code);
                } else { // users
                    return sortState.geo.asc ? a.users - b.users : b.users - a.users;
                }
            });

            let html = `<div class="total-countries">Total countries represented: ${totalCountries}</div>`;
            html += '<table><thead><tr>';
            
            const geoHeaders = [
                { text: 'Flag', key: 'country' },
                { text: 'Users', key: 'users' }
            ];

            geoHeaders.forEach(h => {
                const arrow = sortState.geo.key === h.key 
                    ? (sortState.geo.asc ? '↑' : '↓') 
                    : '↕';
                html += `<th onclick="setSort('geo', '${h.key}')">${h.text} <span class="sort-arrow ${sortState.geo.key === h.key ? 'active' : ''}">${arrow}</span></th>`;
            });

            html += '</tr></thead><tbody>';
            for (const item of sortedDist) {
                const flag = getFlagEmoji(item.country_code);
                html += `<tr><td class="flag">${flag}</td><td class="count">${item.users}</td></tr>`;
            }
            html += '</tbody></table>';
            return html;
        }

        function setSort(tab, key) {
            if (sortState[tab].key === key) {
                sortState[tab].asc = !sortState[tab].asc;
            } else {
                sortState[tab].key = key;
                sortState[tab].asc = (tab === 'geo' && key === 'users') || (tab === 'users' && key === 'share') ? false : true;
            }
            loadTab(currentTab);
        }

        async function loadTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('content').innerHTML = 'Loading...';

            try {
                switch (tab) {
                    case 'hub':
                        const [hubData, shareData] = await Promise.all([
                            fetchData('/hub'),
                            fetchData('/share')
                        ]);

                        let html = '<div class="section"><h2>Hub Information</h2>' + renderKeyValue(hubData) + '</div>';
                        html += '<div class="section"><h2>Share Statistics</h2><ul>';
                        
                        const total = shareData.total_share ?? shareData.total ?? shareData.share_total ?? 'N/A';
                        const avg = shareData.average_share ?? shareData.avg_share ?? shareData.average ?? 'N/A';

                        html += `<li><strong>Total Share:</strong> ${typeof total === 'number' ? formatBytes(total) : total}</li>`;
                        html += `<li><strong>Average Share:</strong> ${typeof avg === 'number' ? formatBytes(avg) : avg}</li>`;
                        html += '</ul></div>';

                        document.getElementById('content').innerHTML = html;
                        break;
                    case 'stats':
                        const statsData = await fetchData('/stats');
                        document.getElementById('content').innerHTML = renderKeyValue(statsData);
                        break;
                    case 'users':
                        let response = await fetchData('/users?limit=500');
                        let rows = [];

                        if (Array.isArray(response)) {
                            rows = response;
                        } else if (response && response.users && Array.isArray(response.users)) {
                            rows = response.users;
                        } else if (response && response.data && Array.isArray(response.data)) {
                            rows = response.data;
                        }

                        document.getElementById('content').innerHTML = renderUsersTable(rows, sortState.users.key, sortState.users.asc);
                        break;
                    case 'geo':
                        const geoData = await fetchData('/geo');
                        document.getElementById('content').innerHTML = renderGeo(geoData);
                        break;
                    case 'chat':
                        html = renderChat();
                        shouldUpdate = true;
                        break;
                }
            } catch (err) {
                document.getElementById('content').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
                console.error('API error:', err);
            }
        }

        async function showUser(encodedNick) {
            const nick = decodeURIComponent(encodedNick);
            try {
                const data = await fetchData(`/user/${encodedNick}`);
                document.getElementById('user-content').innerHTML = renderKeyValue(data, ['share_formatted']);
                document.getElementById('user-detail').style.display = 'block';
            } catch (err) {
                alert(`Failed to load user ${nick}: ${err.message}`);
            }
        }

        function closeUserDetail() {
            document.getElementById('user-detail').style.display = 'none';
        }

        // =================================================================
        // Chat tab — LLM chatbot via WebSocket to the chat gateway
        // =================================================================

        function renderChat() {
            const statusClass = chatConnected ? 'connected' : (chatSocket ? 'error' : '');
            const statusText = chatConnected ? 'Connected' : (chatSocket ? 'Connecting...' : 'Disconnected');
            const adminChecked = chatAdminMode ? 'checked' : '';

            let msgsHtml = '';
            if (chatMessages.length === 0) {
                msgsHtml = '<div class="chat-msg status"><span class="chat-bubble">Ask anything about the hub — try "who is online?" or "show me share statistics"</span></div>';
            }
            for (const msg of chatMessages) {
                if (msg.type === 'user') {
                    msgsHtml += `<div class="chat-msg user"><span class="chat-bubble">${escapeHtml(msg.text)}</span></div>`;
                } else if (msg.type === 'assistant') {
                    msgsHtml += `<div class="chat-msg assistant"><span class="chat-bubble">${formatChatResponse(msg.text)}</span></div>`;
                } else if (msg.type === 'tool') {
                    msgsHtml += `<div class="chat-msg status"><span class="chat-tool-badge">🔧 ${escapeHtml(msg.name)}(${escapeHtml(JSON.stringify(msg.args || {}))})</span></div>`;
                } else if (msg.type === 'thinking') {
                    msgsHtml += `<div class="chat-msg status"><span class="chat-bubble">⏳ Thinking...</span></div>`;
                } else if (msg.type === 'status') {
                    msgsHtml += `<div class="chat-msg status"><span class="chat-bubble">${escapeHtml(msg.text)}</span></div>`;
                }
            }

            return `
                <div class="chat-container">
                    <div class="chat-header">
                        <span class="chat-status ${statusClass}">● ${statusText}</span>
                        <span class="chat-admin-toggle">
                            <label><input type="checkbox" id="chat-admin-check" ${adminChecked} onchange="chatToggleAdmin(this.checked)"> Admin mode</label>
                        </span>
                        <button onclick="chatConnect()" style="font-size:0.8em; padding:4px 12px; border:1px solid #ccc; border-radius:12px; background:#fff; cursor:pointer;">
                            ${chatConnected ? 'Reconnect' : 'Connect'}
                        </button>
                    </div>
                    <div class="chat-messages" id="chat-messages-box">${msgsHtml}</div>
                    <div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="Ask about the hub..." 
                               onkeydown="if(event.key==='Enter')chatSend()" ${chatWaiting || !chatConnected ? 'disabled' : ''}>
                        <button onclick="chatSend()" ${chatWaiting || !chatConnected ? 'disabled' : ''}>Send</button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatChatResponse(text) {
            // Basic markdown-like formatting for LLM responses
            let html = escapeHtml(text);
            // Bold **text**
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Inline code `text`
            html = html.replace(/`(.+?)`/g, '<code style="background:#f0f0f0;padding:1px 4px;border-radius:3px;">$1</code>');
            // Newlines
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function chatConnect() {
            if (chatSocket) {
                chatSocket.close();
                chatSocket = null;
            }
            chatConnected = false;
            chatWaiting = false;

            const adminToken = chatAdminMode ? prompt('Enter admin token (leave empty for user-level access):') : '';
            const wsUrl = CHAT_GATEWAY_URL + '/ws/chat/stream' + (adminToken ? '?token=' + encodeURIComponent(adminToken) : '');

            chatMessages.push({ type: 'status', text: 'Connecting to chat gateway...' });
            refreshChat();

            try {
                chatSocket = new WebSocket(wsUrl);
            } catch(e) {
                chatMessages.push({ type: 'status', text: 'Failed to create WebSocket: ' + e.message });
                refreshChat();
                return;
            }

            chatSocket.onopen = () => {
                console.log('Chat WebSocket opened');
            };

            chatSocket.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch(e) {
                    return;
                }

                switch(data.type) {
                    case 'connected':
                        chatConnected = true;
                        chatMessages.push({ type: 'status', text: `Connected as ${data.access} — model: ${data.model}` });
                        // Remove any "thinking" placeholder
                        chatMessages = chatMessages.filter(m => m.type !== 'thinking');
                        break;
                    case 'thinking':
                        // Add thinking indicator (replace any existing one)
                        chatMessages = chatMessages.filter(m => m.type !== 'thinking');
                        chatMessages.push({ type: 'thinking' });
                        break;
                    case 'tool_call':
                        chatMessages = chatMessages.filter(m => m.type !== 'thinking');
                        chatMessages.push({ type: 'tool', name: data.name, args: data.args });
                        break;
                    case 'tool_result':
                        // Optional: could annotate success/failure
                        chatMessages.push({ type: 'thinking' });
                        break;
                    case 'response':
                        chatMessages = chatMessages.filter(m => m.type !== 'thinking');
                        chatMessages.push({ type: 'assistant', text: data.content });
                        chatWaiting = false;
                        break;
                    case 'error':
                        chatMessages = chatMessages.filter(m => m.type !== 'thinking');
                        chatMessages.push({ type: 'status', text: '❌ ' + data.content });
                        chatWaiting = false;
                        break;
                }
                refreshChat();
            };

            chatSocket.onclose = () => {
                chatConnected = false;
                chatMessages.push({ type: 'status', text: 'Disconnected from chat gateway.' });
                refreshChat();
            };

            chatSocket.onerror = (err) => {
                chatConnected = false;
                chatMessages.push({ type: 'status', text: 'WebSocket error — is the chat gateway running on port 8001?' });
                refreshChat();
            };
        }

        function chatSend() {
            const input = document.getElementById('chat-input');
            if (!input || !chatSocket || chatWaiting) return;
            const msg = input.value.trim();
            if (!msg) return;

            chatMessages.push({ type: 'user', text: msg });
            chatWaiting = true;
            input.value = '';

            chatSocket.send(JSON.stringify({ message: msg }));
            refreshChat();
        }

        function chatToggleAdmin(checked) {
            chatAdminMode = checked;
            // Reconnect If already connected to switch access level
            if (chatConnected) {
                chatMessages.push({ type: 'status', text: 'Admin mode changed — reconnect to apply.' });
                refreshChat();
            }
        }

        function refreshChat() {
            // Only re-render if chat tab is active
            if (currentTab !== 'chat') return;
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = renderChat();
            // Scroll messages to bottom
            const box = document.getElementById('chat-messages-box');
            if (box) box.scrollTop = box.scrollHeight;
            // Re-focus input
            const input = document.getElementById('chat-input');
            if (input && !chatWaiting && chatConnected) input.focus();
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                loadTab(tab.dataset.tab);
            });
        });

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                // Don't poll data tabs while on chat (avoids overwriting chat HTML)
                if (currentTab === 'chat') return;
                fetchOpsAndBots().then(() => loadTab(currentTab));
            }, 30000);
        }

        loadTab('hub');
        startPolling();
    </script>
</body>
</html>
