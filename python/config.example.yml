# Verlihub Python Server Configuration
# =====================================
#
# This file configures the Verlihub Python API server and optional hub.
#
# Usage:
#   verlihub-server -c config.yml
#   verlihub-server -c config.yml --env production
#
# Priority: CLI args > Environment vars > This file > Database (unless --force)
#
# Database vs Config precedence:
#   On startup, if the database already contains a value for a setting (e.g.
#   hub.name was previously set via the web dashboard or !set command), the
#   database value is kept and the YAML value is ignored. This prevents YAML
#   from overwriting runtime changes made through the admin interface.
#
#   To force YAML values to overwrite the database, pass --force:
#     verlihub-server -c config.yml --force

# =============================================================================
# Runtime Settings
# =============================================================================

# Mode: api, hub, both
#
#   both - (default) Full stack: REST API + NMDC hub in the same process.
#          The API thread and hub event loop share memory so changes made
#          through the REST API or dashboard (topic, kicks, user registration)
#          take effect on the hub immediately.
#
#   api  - REST API only. Provides user management, ban management, invite
#          codes, health checks, and the web dashboard — all backed by the
#          database. Does NOT require the C++ NMDC core. Hub-dependent
#          endpoints (online users, kick, broadcast, live stats, console)
#          return HTTP 503. Use this mode when you want a standalone admin
#          interface, or when deploying without the C++ libraries.
#
#   hub  - NMDC hub only. Runs the C++ hub core with Lua/Python plugin
#          support. No REST API or web dashboard.
#
# Split-process deployment (separate api and hub processes):
#   Both processes can share the same database. The API process writes to the
#   database, and the hub process reads from it. To notify the hub process
#   that settings have changed, send it SIGHUP or call the /api/v1/hub/reload
#   endpoint on the hub's own API (if it runs in "both" mode on a different
#   port). User registration and ban changes are picked up on next login
#   automatically since the hub queries the database for each auth event.
#   In-memory state (topic, MOTD) requires an explicit reload.
#
mode: both

# Environment: development, qa, production
# Production mode enforces security requirements
environment: development

# =============================================================================
# Database Configuration
# =============================================================================
# Verlihub-py supports SQLite (default), MySQL, and PostgreSQL.
#
# SQLite (default) - No additional setup needed:
#   database:
#     type: sqlite
#     # path: /path/to/verlihub.db  # Optional: defaults to config_dir/verlihub.db
#
# SQLite in-memory (no disk writes, data lost on restart — useful for testing):
#   database:
#     type: sqlite
#     path: ":memory:"
#
# MySQL:
#   database:
#     type: mysql
#     host: localhost
#     port: 3306
#     user: verlihub
#     password: secret
#     name: verlihub
#
# PostgreSQL:
#   database:
#     type: postgresql
#     host: localhost
#     port: 5432
#     user: verlihub
#     password: secret
#     name: verlihub
#
# Direct URL (advanced - use async driver):
#   database:
#     url: postgresql+asyncpg://user:pass@host:5432/dbname
#
database:
  # Database type: sqlite (default), mysql, postgresql
  type: sqlite
  
  # SQLite path (optional - defaults to config_dir/verlihub.db)
  # path: /var/lib/verlihub/verlihub.db
  
  # For MySQL/PostgreSQL:
  # host: localhost
  # port: 3306  # MySQL
  # port: 5432  # PostgreSQL
  # user: verlihub
  # password: ""  # Change in production!
  # name: verlihub

# =============================================================================
# API Server Configuration
# =============================================================================
api:
  # Binding
  host: "127.0.0.1"  # Use 0.0.0.0 to expose externally (behind reverse proxy)
  port: 8000
  
  # Authentication
  # REQUIRED in production - generate with: python -c "import secrets; print(secrets.token_hex(32))"
  secret: ""  # If empty, random secret generated (tokens invalidate on restart)
  username: admin  # Bootstrap admin account (seeded into DB at startup)
  password: ""  # REQUIRED in production
  
  # Token settings
  token_expire_minutes: 60
  
  # CORS - restrict to specific origins in production
  cors_origins:
    - "*"  # Development: allow all
    # Production example:
    # - "https://dashboard.example.com"
    # - "https://admin.example.com"
  
  # Cookies
  secure_cookies: false  # Set true in production (requires HTTPS)
  
  # Self-registration
  # Allow users to create accounts from the login screen.
  # Registered nicks are reserved on the hub — only the owner can use them.
  registration_enabled: true       # Set false to disable public registration
  registration_require_invite: false  # Require an invite code to register
  registration_default_class: 1    # 1=Registered, 2=VIP (class for new accounts)

# =============================================================================
# Hub Configuration (for mode: hub or both)
# =============================================================================
hub:
  name: "My DC++ Hub"
  description: "Welcome to my hub!"
  
  # Network
  port: 4111
  listen_host: "0.0.0.0"
  
  # Hub list registration
  # When host is set to a non-empty value (e.g. "hub.example.com:4111"), the hub
  # will register itself on public hub lists so DC++ clients can discover it.
  # Leave host empty to keep the hub unlisted / private.
  host: ""  # e.g., "hub.example.com:4111"
  
  # Hub list servers to register on (only used when host is non-empty).
  # Defaults to the well-known public hub lists if not specified.
  # hublist_servers:
  #   - "hublist.te-home.net"
  #   - "hublist.pwiam.com"
  #   - "hublist.example.org"  # add your own
  
  # Hub info
  owner: ""
  topic: ""
  category: ""
  
  # Logo URL — displayed on the dashboard login screen and navbar.
  # Leave empty to use the default Verlihub logo.
  logo: ""  # e.g., "https://example.com/my-hub-logo.png"
  
  # Encoding for legacy clients
  encoding: "CP1252"
  
  # MOTD file path
  motd_file: ""
  
  # Limits
  max_users: 1000

# =============================================================================
# Bot Configuration
# =============================================================================
bots:
  security:
    nick: "Hub-Security"
    description: "Hub security system"
  
  op_chat:
    nick: "OpChat"
    description: "Operator chat"

# =============================================================================
# User Accounts
# =============================================================================
# Pre-register user accounts at startup. These are inserted into the database
# if they don't already exist. Existing accounts are NOT overwritten unless
# --force is passed on the command line.
#
# User classes: master (10), admin (5), operator (3), vip (2), registered (1)
#
# Note: The api.username / api.password admin is ALSO seeded into the database
# as an admin-class user. You do NOT need to duplicate it here.
# All users (including the api admin) share the same RegUser table and can
# log into the dashboard. Users can also self-register from the login screen
# if registration_enabled is true.
users:
  masters:
    - nick: admin
      password: changeme_admin_password
      note: "Primary administrator"
    # - nick: admin2
    #   password: another_password

  admins: []
    # - nick: moderator1
    #   password: mod_password
    #   note: "Trusted moderator"

  operators: []
    # - nick: op1
    #   password: op_password

  vips: []
    # - nick: vipuser
    #   password: vip_password

  registered: []
    # - nick: regular1
    #   password: user_password

# =============================================================================
# Plugin Configuration (generic C++ plugins)
# =============================================================================
# For plugins that are not Lua or Python scripts (e.g. plugman, or any custom
# C++ shared library plugin). Lua and Python have their own sections below.
plugins:
  # Plugin directory (leave empty for default)
  directory: ""
  
  # Generic plugin list
  list: []
    # - name: my_custom_plugin
    #   enabled: true
    #   autoload: true
    #   config:
    #     setting1: value1

# =============================================================================
# Lua Plugin & Scripts
# =============================================================================
# The Lua plugin (liblua_pi.so) enables loading Lua scripts into the hub.
# Scripts extend the hub with features like chat management, security,
# entertainment, etc.
lua:
  # Enable the Lua plugin
  enabled: true
  
  # Fetch scripts from GitHub repos on startup
  github_scripts:
    - repo: "Verlihub/ledokol"
      files:
        - "ledokol.lua"
    # - repo: "username/my-lua-script"
    #   files: []
  
  # Scripts to auto-load (via !luaload)
  autoload:
    - "ledokol.lua"
  
  # Per-script configuration
  # Each key is a script name, value is a map of settings applied after loading.
  # For ledokol, settings are applied via !ledoset key value.
  # For other scripts, the convention is !<scriptname>set key value.
  script_config: {}
    # ledokol:
    #   antispam_class: 3
    #   calculator: 1
    #   chat_history: 1
    #   chat_history_lines: 50
    # my_other_script:
    #   some_setting: some_value

# =============================================================================
# Python Plugin & Scripts
# =============================================================================
# The Python plugin (libpython_pi.so) enables loading Python scripts into
# the hub. Works similarly to the Lua plugin but for Python scripts.
python:
  # Enable the Python plugin
  enabled: true
  
  # Fetch scripts from GitHub repos on startup
  github_scripts: []
    # - repo: "username/my-python-hub-script"
    #   files:
    #     - "my_script.py"
  
  # Scripts to auto-load (via +pyload)
  autoload: []
    # - "my_script.py"
  
  # Per-script configuration
  # Each key is a script name, value is a map of settings.
  script_config: {}
    # my_script:
    #   api_key: "abc123"
    #   max_retries: 3

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: ""     # Log file path (empty = stdout only)
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
