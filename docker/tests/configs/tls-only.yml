# TLS-only mode test configuration
# Forces all clients to use encrypted NMDCS connections.
# Uses self-signed certificate.
environment: test
mode: api

database:
  type: mysql
  host: mysql
  port: 3306
  name: verlihub_test
  user: verlihub
  password: verlihub

api:
  host: "0.0.0.0"
  port: 8000
  username: admin
  password: admin123
  cors_origins:
    - "*"

hub:
  name: "TLS-Only Test Hub"
  port: 4111
  max_users: 100

users:
  masters:
    - nick: admin
      password: admin123

tls:
  enabled: true
  port: 411
  only_mode: true
  min_version: 3
  cert_org: "Verlihub TLS-Only Test"
  cert_email: "test@localhost"
  cert_host: "localhost"

logging:
  level: debug
