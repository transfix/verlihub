name: Remote vLLM Integration Tests

on:
  push:
    branches: [master, main, develop, verlihub-py, verlihub-py-llm]
  pull_request:
    branches: [master, main, develop, verlihub-py]

jobs:
  vllm-remote-integration-tests:
    name: Remote vLLM Chat + Tool-Calling Tests
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.??* 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check vLLM endpoint reachability
        run: |
          echo "Checking remote vLLM endpoint..."
          if curl -sf --max-time 10 https://vllm-qwen35-35b.tinyhost.xyz/v1/models > /dev/null; then
            echo "vLLM endpoint is reachable"
          else
            echo "WARNING: vLLM endpoint is not reachable — tests will likely fail"
          fi

      - name: Clean up previous test resources
        run: |
          docker compose -f docker/docker-compose.vllm-remote-test.yml down --remove-orphans --volumes 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

      - name: Run remote vLLM integration tests
        run: ./docker_test_launcher.sh vllm-remote

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          docker compose -f docker/docker-compose.vllm-remote-test.yml logs > /tmp/ci-logs/vllm-remote-compose.log 2>&1 || true
          docker compose -f docker/docker-compose.vllm-remote-test.yml logs vllm-hub > /tmp/ci-logs/vllm-hub.log 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-remote-test-logs
          path: /tmp/ci-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker compose -f docker/docker-compose.vllm-remote-test.yml down --remove-orphans 2>/dev/null || true
