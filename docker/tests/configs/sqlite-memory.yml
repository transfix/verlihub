# SQLite in-memory configuration
# Database is ephemeral - lost on restart
environment: development
mode: api

database:
  type: sqlite
  # empty path = in-memory
  
api:
  host: "0.0.0.0"
  port: 8000
  username: admin
  password: admin123
  cors_origins:
    - "*"
  
hub:
  name: "SQLite Memory Test Hub"
  port: 4111
  max_users: 100

logging:
  level: debug
