#
# Root pyproject.toml — builds the verlihub Python package WITH native
# C++ core (_verlihub_core.so) via scikit-build-core + SWIG.
#
# Install from a clone (compiles C++ core from source):
#   pip install .              # regular install
#   pip install -e .           # editable (dev) install
#   poetry install             # poetry editable install
#
# The build requires system C++ libraries (OpenSSL, MySQL/MariaDB,
# libmaxminddb, ICU, PCRE, zlib, gettext) plus cmake, swig, g++.
# On Debian/Ubuntu:
#   sudo apt install cmake swig g++ libssl-dev libmysqlclient-dev \
#     libmaxminddb-dev libicu-dev libpcre3-dev zlib1g-dev gettext \
#     libasprintf-dev
#
# For pure-Python development without compiling C++, the lighter
# python/pyproject.toml (setuptools-based) can still be used.
#

[build-system]
requires = ["scikit-build-core>=0.10", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "verlihub"
version = "1.7.0.0"
description = "Python FastAPI wrapper for Verlihub DC hub with native C++ core"
readme = "python/README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Verlihub Team", email = "info@verlihub.net"},
]
keywords = ["dc", "direct-connect", "hub", "p2p", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.14",
    "asyncmy>=0.2.9",
    "asyncpg>=0.29.0",       # PostgreSQL async support
    "aiosqlite>=0.19.0",     # SQLite async support for testing
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.26.0",         # For HubClient remote API access
    "jinja2>=3.1.0",         # For dashboard templates
    "python-multipart>=0.0.6",  # For form parsing in FastAPI/Starlette
    "pyyaml>=6.0.0",         # For YAML configuration files
    "click>=8.0.0",          # For CLI tools
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "mcp[cli]>=1.0.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
]
ai = [
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
verlihub-server = "verlihub.server:main"
verlihub-api = "verlihub.api.app:main"
verlihub-cli = "verlihub.cli:main"
verlihub-bench = "verlihub.benchmarks.cli:main"
verlihub-mcp = "verlihub.client.mcp:main"

[project.urls]
Homepage = "https://verlihub.net"
Repository = "https://github.com/verlihub/verlihub"
Documentation = "https://verlihub.net/doc/"

# --- scikit-build-core settings ---

[tool.scikit-build]
cmake.version = ">=3.16"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/verlihub"]
wheel.install-dir = "verlihub"
install.components = ["PythonModule"]

# Editable installs: rebuild the C++ module when sources change
editable.mode = "redirect"
editable.rebuild = true

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
PYTHON_WHEEL_BUILD = "ON"

# --- Poetry settings ---
# Poetry uses these to locate packages for editable installs (poetry install).
# The actual wheel build is handled by scikit-build-core above.

[tool.poetry]
packages = [{include = "verlihub", from = "python"}]

# --- tool configs ---

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "verlihub_core.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]

[tool.coverage.run]
source = ["verlihub"]
concurrency = ["greenlet", "thread"]
omit = [
    "*/verlihub_core.py",
    "*/_verlihub_core*",
    "*/build/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
omit = [
    "*/verlihub_core.py",
    "*/_verlihub_core*",
]
show_missing = true
skip_covered = false
fail_under = 0

[tool.coverage.html]
directory = "build/coverage_html/python"
